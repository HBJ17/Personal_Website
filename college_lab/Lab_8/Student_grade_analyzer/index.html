<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Mark Analyser </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Student Mark Analyser</h1>
    </header>
    
    <main>
        <h3>Fill the Form</h3>

        <div>
            <label>Student Name -</label>
            <input type="text" placeholder="Name">
        </div>

        <div>
            <label>Maths -</label>
            <input type="number" placeholder="Enter Marks" id="maths">
        </div>

        <div>
            <label>Physics -</label>
            <input type="number" placeholder="Enter Marks" id="physics">
        </div>

        <div>
            <label>Chemistry -</label>
            <input type="number" placeholder="Enter Marks" id="chemistry">
        </div>

        <div>
            <label>Biology -</label>
            <input type="number" placeholder="Enter Marks" id="biology">
        </div>

        <div>
            <label>English -</label>
            <input type="number" placeholder="Enter Marks" id="english">
        </div>

        <button>Analyse Marks</button>

        <section id="result">
            <h4></h4>
            <h4>Performace Feedback will appear here...</h4>
        </section>

    </main>

    <footer>
        <h4>&copy - Student Mark Analyser</h4>
    </footer>

    <script src="script.js"></script>
</body>

</html>
