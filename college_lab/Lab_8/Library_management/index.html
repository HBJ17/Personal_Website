<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Book Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f4f4;
        }

        .container-box {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        .status-available {
            color: green;
            font-weight: bold;
        }

        .status-issued {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container-box">

        <h2 class="text-center mb-4">Library Book Management</h2>

        <div class="row">

            <div class="col-md-5">
                <input type="text" id="title" class="form-control" placeholder="Book Title">
            </div>

            <div class="col-md-5">
                <input type="text" id="author" class="form-control" placeholder="Author Name">
            </div>

            <div class="col-md-2">
                <button class="btn btn-primary w-100" id="addBtn">
                    Add Book
                </button>
            </div>

        </div>

        <div class="mt-4">

            <h5>Total Books: <span id="totalBooks">0</span></h5>

            <h5>Available Books: <span id="availableBooks">0</span></h5>

            <h5>Issued Books: <span id="issuedBooks">0</span></h5>

        </div>

        <table class="table table-bordered table-striped mt-4">

            <thead class="table-dark">
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="bookTableBody">

            </tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>

</html>
